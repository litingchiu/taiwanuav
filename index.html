<style>
/* Layout: aeronautical-chart plate — a 3D island stage beside an index panel (stacks on phones) */
:root{
  --bg:#E9EEF0; --surface:#F7F9F9; --ink:#14232B; --muted:#5A6B73; --line:#C9D4D8;
  --accent:#0F5E7A; --sea:#CFDDE3; --grid:#9FB5BF; --land-lo:#B9C6A6; --land-hi:#7E8F78; --flow:#14232B;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D161C; --surface:#131F27; --ink:#E3ECEF; --muted:#8FA2AB; --line:#25353F;
  --accent:#6FC3DF; --sea:#0F2430; --grid:#2A4654; --land-lo:#4D5E48; --land-hi:#2E3A2C; --flow:#E3ECEF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D161C; --surface:#131F27; --ink:#E3ECEF; --muted:#8FA2AB; --line:#25353F;
  --accent:#6FC3DF; --sea:#0F2430; --grid:#2A4654; --land-lo:#4D5E48; --land-hi:#2E3A2C; --flow:#E3ECEF; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{min-height:100%;display:flex;flex-direction:column;gap:12px;padding-block:14px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px}
h1{font-family:var(--f-display);font-weight:900;font-size:clamp(22px,3.2vw,30px);line-height:1.2;margin:0;letter-spacing:.02em;text-wrap:balance}
.sub{margin:2px 0 0;color:var(--muted)}
.coord{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.04em;white-space:nowrap}
main{display:grid;grid-template-rows:58svh auto;gap:12px;flex:1;min-height:0}
.stage{position:relative;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--sea);min-height:0}
#gl{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#gl.drag{cursor:grabbing}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lab{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;font-size:12px;line-height:1.3;
  padding:2px 7px;border-radius:3px;background:var(--surface);color:var(--ink);border:1px solid var(--line);
  box-shadow:0 1px 3px rgba(0,0,0,.12);transition:opacity .2s}
.lab.dist{pointer-events:auto;cursor:pointer;font-weight:700;display:flex;align-items:center;gap:6px;padding:3px 8px}
.lab.dist i{width:8px;height:8px;border-radius:2px;display:inline-block}
.lab.dist small{font-family:var(--f-mono);font-weight:400;color:var(--muted)}
.lab.co{font-size:11.5px}
.lab.co.star{border-color:currentColor}
.tools{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap}
.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  padding:5px 11px;border-radius:4px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,.tab:focus-visible,.seg:focus-visible,.co-item:focus-visible,.lab.dist:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.seg-toggle{display:inline-flex}
.seg-toggle .btn{border-radius:0}.seg-toggle .btn+.btn{margin-left:-1px}
.seg-toggle .btn:first-child{border-radius:4px 0 0 4px}.seg-toggle .btn:last-child{border-radius:0 4px 4px 0}
.lab.city{pointer-events:auto;cursor:pointer;font-family:var(--f-display);font-weight:900;font-size:13px;display:flex;gap:5px;align-items:baseline;padding:2px 8px;transform:translate(-50%,-50%)}
.lab.city small{font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--accent)}
.lab.city.empty{background:none;border-color:transparent;box-shadow:none;color:var(--muted);font-size:12px;cursor:default}
.lab.city:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{position:absolute;right:10px;bottom:10px;font-size:11.5px;color:var(--muted);background:var(--surface);
  padding:3px 8px;border-radius:3px;border:1px solid var(--line)}
.card{position:absolute;left:10px;bottom:10px;width:min(340px,calc(100% - 20px));background:var(--surface);
  border:1px solid var(--line);border-radius:6px;padding:14px 16px;box-shadow:0 6px 24px rgba(0,0,0,.16)}
.card .x{position:absolute;top:8px;right:8px;border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;line-height:1;padding:4px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--muted)}
.chip i{width:9px;height:9px;border-radius:2px}
.card h2{font-family:var(--f-display);font-size:20px;margin:4px 0 0;line-height:1.3}
.card .en{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin:0 0 8px}
.card p{margin:6px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px;margin-top:8px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.rel{display:flex;flex-wrap:wrap;gap:4px}
.rel button{font:inherit;font-size:12px;border:1px solid var(--line);background:none;color:var(--ink);border-radius:3px;padding:0 6px;cursor:pointer}
.card a{color:var(--accent)}
.loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:16px;color:var(--muted);pointer-events:none;transition:opacity .6s}

aside{background:var(--surface);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;font:inherit;font-weight:500;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:10px 0;cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.pane{padding:14px 16px;overflow:auto;min-height:0}
.pane h3{font-family:var(--f-display);font-size:15px;margin:0 0 8px}
.note{font-size:12px;color:var(--muted);margin:10px 0 0}
.seg{display:grid;grid-template-columns:12px 1fr auto;gap:2px 10px;align-items:baseline;width:100%;text-align:left;font:inherit;color:inherit;
  background:none;border:0;border-bottom:1px solid var(--line);padding:10px 4px;cursor:pointer;border-radius:0}
.seg:hover,.seg.on{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.seg i{width:12px;height:12px;border-radius:3px;align-self:center}
.seg b{font-weight:700}
.seg .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.seg .d{grid-column:2/4;font-size:12.5px;color:var(--muted)}
.grp{margin:0 0 14px}
.grp h4{display:flex;align-items:center;gap:6px;font-size:12px;letter-spacing:.06em;color:var(--muted);margin:0 0 4px;font-weight:500}
.grp h4 i{width:8px;height:8px;border-radius:2px}
.co-item{display:flex;justify-content:space-between;gap:10px;width:100%;font:inherit;color:inherit;text-align:left;background:none;border:0;padding:5px 4px;cursor:pointer;border-radius:3px}
.co-item:hover{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.co-item span:last-child{color:var(--muted);font-size:12.5px;white-space:nowrap}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin:0 0 16px}
.stat b{display:block;font-family:var(--f-mono);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.3}
.stat span{font-size:12.5px;color:var(--muted)}
.bars{display:grid;grid-template-columns:44px 1fr;gap:6px 10px;align-items:center;margin:4px 0 6px;font-variant-numeric:tabular-nums}
.bars .y{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.bars .b{height:18px;background:var(--accent);border-radius:2px;position:relative;min-width:2px}
.bars .b span{position:absolute;left:calc(100% + 6px);top:50%;transform:translateY(-50%);font-family:var(--f-mono);font-size:12px;white-space:nowrap}
.affs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.affs .btn{font-size:12.5px;padding:3px 9px}
.bdgs{display:inline-flex;flex-wrap:wrap;gap:3px;margin-left:6px;vertical-align:1px}
.card .bdgs{margin:0 0 6px}
.bdg{font-style:normal;font-size:10.5px;line-height:1.5;padding:0 5px;border-radius:2px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.bdg-td{border-color:var(--accent);color:var(--accent)}
.co-item>span:first-child{min-width:0}
.src{padding-left:18px;margin:6px 0 0;font-size:12.5px}
.src a{color:var(--accent)}
.lab.co.all{font-size:10.5px;padding:1px 5px;box-shadow:none}
.pane h3 .btn{float:right;font-family:var(--f-body);font-size:12px;padding:1px 8px}
.pane h3 small{font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted);margin-left:6px}
/* story tour */
.story{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:min(520px,calc(100% - 20px));background:var(--surface);
  border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:12px 16px 10px}
.story .k{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--accent)}
.story h2{font-family:var(--f-display);font-size:18px;line-height:1.3;margin:2px 0 4px}
.story p{margin:0 0 4px}
.story .who{font-size:12.5px;color:var(--muted)}
.story .bar{height:3px;background:var(--line);border-radius:2px;margin:8px 0;overflow:hidden}
.story .bar i{display:block;height:100%;width:0;background:var(--accent)}
.story .ctl{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.stage.storying .hint{display:none}
.stage.storying .card{top:56px;bottom:auto}
/* timeline */
.timebar{position:absolute;left:10px;right:10px;bottom:10px;display:grid;grid-template-columns:auto auto 1fr;gap:4px 12px;align-items:center;
  background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 12px;box-shadow:0 6px 24px rgba(0,0,0,.14)}
.timebar .yr{font-family:var(--f-mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.2}
.timebar input{width:100%;accent-color:var(--accent)}
.timebar .tk{grid-column:1/-1;font-size:12.5px;color:var(--muted);min-height:1.6em}
.timebar .tk b{color:var(--ink);font-weight:500}
.stage[data-view="time"] .hint{display:none}
.stage[data-view="time"] .card{bottom:100px}
/* list view */
.listview{position:absolute;inset:0;background:var(--surface);overflow:auto;padding:56px 16px 16px}
.lv-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
.lv-bar input,.lv-bar select{font:inherit;font-size:13px;padding:5px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
.lv-bar input{flex:1 1 180px;min-width:0}
.lv-bar .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.lv-chips{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 12px}
.lv-chips .btn{font-size:12px;padding:2px 8px;display:inline-flex;align-items:center;gap:5px}
.lv-chips .btn i{width:8px;height:8px;border-radius:2px}
.lv-chips .btn[aria-pressed="true"] i{outline:1px solid var(--surface)}
.lv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.lv-item{display:flex;flex-direction:column;gap:2px;text-align:left;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);
  border-left:4px solid var(--c);border-radius:4px;padding:10px 12px;cursor:pointer}
.lv-item:hover{border-color:var(--c)}
.lv-item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lv-item small{font-size:12px;color:var(--muted)}
.lv-item span{font-size:12.5px}
.stage[data-view="list"] .isl{display:none!important}
/* onboarding */
.guide{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(10,20,26,.45)}
.guide .box{width:100%;max-width:420px;background:var(--surface);color:var(--ink);border-radius:8px;padding:22px 24px 18px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.guide .k{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;color:var(--accent)}
.guide h2{font-family:var(--f-display);font-size:22px;line-height:1.3;margin:4px 0 8px}
.guide p{margin:0}
.guide .dots{display:flex;gap:5px;margin:16px 0 14px}
.guide .dots i{width:6px;height:6px;border-radius:3px;background:var(--line);transition:width .25s}
.guide .dots i.on{width:18px;background:var(--accent)}
.guide .ctl{display:flex;justify-content:space-between;gap:8px}
.guide .ctl span{display:flex;gap:6px}
.btn.pri{background:var(--accent);color:var(--surface);border-color:var(--accent)}
@media (min-width:900px){
  .app{height:100%}
  main{grid-template-rows:none;grid-template-columns:minmax(0,1fr) 370px}
  .stage{height:auto}
}
@media (prefers-reduced-motion:reduce){.lab,.loading,.guide .dots i{transition:none}}
</style>
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>

<div class="app">
  <header>
    <div>
      <h1>無人機供應鏈臺灣島</h1>
      <p class="sub" id="sub">8 個供應鏈環節，由北到南排成上游到下游。點選建築看廠商介紹。</p>
    </div>
    <div class="coord">N 21.9°–25.3° · E 120.0°–122.0°<br><span id="dataNote"></span></div>
  </header>
  <main>
    <section class="stage" id="stage" aria-label="可互動的 3D 臺灣島">
      <canvas id="gl"></canvas>
      <div class="labels" id="labels"></div>
      <div class="loading" id="loading">正在組裝供應鏈島…</div>
      <div class="listview" id="listview" hidden></div>
      <div class="tools">
        <span class="seg-toggle" role="group" aria-label="檢視"><button class="btn" data-view="island" aria-pressed="true">島嶼</button><button class="btn" data-view="list" aria-pressed="false">清單</button><button class="btn" data-view="time" aria-pressed="false">時間</button></span>
        <span class="seg-toggle isl" role="group" aria-label="擺放方式"><button class="btn" data-mode="geo" aria-pressed="true">依所在地</button><button class="btn" data-mode="seg" aria-pressed="false">依環節</button></span>
        <button class="btn isl" id="tourBtn" aria-pressed="false">▶ 導覽</button>
        <button class="btn isl" id="labBtn" aria-pressed="false">名牌</button>
        <button class="btn isl" id="flowBtn" aria-pressed="true">流向</button>
        <button class="btn isl" id="resetBtn">全景</button>
        <button class="btn" id="helpBtn" aria-label="操作說明">?</button>
      </div>
      <div class="hint" id="hint">建築依單位所在地擺放 · 點縣市看當地單位</div>
      <div class="timebar" id="timebar" hidden>
        <button class="btn" id="tPlay" aria-label="播放時間軸">▶</button>
        <span class="yr" id="tYear"></span>
        <input type="range" id="tRange" step="1" aria-label="年份">
        <div class="tk" id="tTick" aria-live="polite"></div>
      </div>
      <div class="card" id="card" hidden></div>
      <div class="story" id="story" aria-live="polite" hidden></div>
    </section>
    <aside>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="t-seg" aria-selected="true" data-p="p-seg">環節</button>
        <button class="tab" role="tab" id="t-co" aria-selected="false" data-p="p-co">廠商</button>
        <button class="tab" role="tab" id="t-data" aria-selected="false" data-p="p-data">產業數據</button>
      </div>
      <div class="pane" id="p-seg" role="tabpanel"></div>
      <div class="pane" id="p-co" role="tabpanel" hidden></div>
      <div class="pane" id="p-data" role="tabpanel" hidden></div>
    </aside>
  </main>
</div>

/* flow links */
/* endpoints: segment district in 依環節, centroid of the segment's real locations in 依所在地 */
function segPos(s,m){
  const ps=m==="geo"?s.cos.filter(c=>c.loc.kind!=="unk").map(c=>c.mesh.userData):[];
  if(!ps.length)return s.center.clone();
  const p=new THREE.Vector3();ps.forEach(u=>p.add(u.geo));p.multiplyScalar(1/ps.length);p.y=Math.max(...ps.map(u=>u.geo.y+u.ht));return p;}
const dotGeo=new THREE.SphereGeometry(1,12,10);
const flows=LINKS.map(([a,b])=>{
  const line=new THREE.Line(new THREE.BufferGeometry(),new THREE.LineBasicMaterial({transparent:true,opacity:0.4}));scene.add(line);
  const dots=[];[0,1/3,2/3].forEach(o=>[0,0.014,0.028].forEach((lag,j)=>{
    const d=new THREE.Mesh(dotGeo,new THREE.MeshBasicMaterial({color:SEGS[segIdx(a)].color,transparent:true,depthWrite:false}));
    d.scale.setScalar([0.27,0.19,0.12][j]);scene.add(d);dots.push({d,o,lag,fade:[1,0.6,0.3][j]});}));
  return {a,b,line,dots};
});
function buildFlows(m){flows.forEach((f,i)=>{
  const A=segPos(SEGS[segIdx(f.a)],m),B=segPos(SEGS[segIdx(f.b)],m);
  A.y+=0.6;B.y+=0.6;const mid=A.clone().add(B).multiplyScalar(0.5);mid.x+=(i%2?3:-3);mid.y+=5+A.distanceTo(B)*0.18;
  f.curve=new THREE.QuadraticBezierCurve3(A,mid,B);f.line.geometry.setFromPoints(f.curve.getPoints(64));});}

buildFlows(mode);

function tok(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function applyTheme(){
  const seaC=new THREE.Color(tok("--sea"));scene.background=seaC;seaMat.color=seaC;
  if(grid)scene.remove(grid);grid=new THREE.GridHelper(300,60,tok("--grid"),tok("--grid"));grid.position.y=0.14;
  grid.material.transparent=true;grid.material.opacity=0.35;scene.add(grid);
  const lo=new THREE.Color(tok("--land-lo")),hi=new THREE.Color(tok("--land-hi")),c=new THREE.Color();
  tiles.forEach((t,i)=>{c.copy(lo).lerp(hi,Math.min(1,Math.max(0,(t.h-0.4)/2.3)));if(mode==="seg")c.lerp(new THREE.Color(SEGS[t.seg].color),0.16);tileMesh.setColorAt(i,c);});
  plat.material.color=lo.clone().lerp(hi,0.3);

/* ---------- camera & controls ---------- */
const view={az:-0.42,el:0.92,tx:0,ty:0,tz:2,zoom:1};
const HOME={tx:0,tz:2,zoom:1};
function updateCam(){
  const w=stage.clientWidth,h=stage.clientHeight,asp=w/h;
  let half=31;if(asp<1)half=31/Math.max(asp,0.55)*0.8;half/=view.zoom;
  Object.assign(camera,{left:-half*asp,right:half*asp,top:half,bottom:-half});camera.updateProjectionMatrix();
  const d=120;camera.position.set(view.tx+d*Math.cos(view.el)*Math.sin(view.az),view.ty+d*Math.sin(view.el),view.tz+d*Math.cos(view.el)*Math.cos(view.az));
  camera.lookAt(view.tx,view.ty,view.tz);
}
function resize(){renderer.setSize(stage.clientWidth,stage.clientHeight,false);updateCam();}
new ResizeObserver(resize).observe(stage);resize();

const ptrs=new Map();let moved=0,pinch0=0,zoom0=1;
canvas.addEventListener("pointerdown",e=>{canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;
  if(ptrs.size===2){const [p,q]=[...ptrs.values()];pinch0=Math.hypot(p.x-q.x,p.y-q.y);zoom0=view.zoom;}canvas.classList.add("drag");});
canvas.addEventListener("pointermove",e=>{
  if(!ptrs.has(e.pointerId)){hover(e);return;}
  const p=ptrs.get(e.pointerId),dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
  if(ptrs.size===1){view.az-=dx*0.006;view.el=Math.min(1.35,Math.max(0.38,view.el+dy*0.004));stopTour();}
  else if(ptrs.size===2){const [a,b]=[...ptrs.values()];view.zoom=Math.min(5,Math.max(0.6,zoom0*Math.hypot(a.x-b.x,a.y-b.y)/pinch0));}
});
function endPtr(e){if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);canvas.classList.remove("drag");if(moved<6&&ptrs.size===0)pick(e);}
canvas.addEventListener("pointerup",endPtr);canvas.addEventListener("pointercancel",e=>{ptrs.delete(e.pointerId);canvas.classList.remove("drag");});
canvas.addEventListener("wheel",e=>{e.preventDefault();view.zoom=Math.min(5,Math.max(0.6,view.zoom*Math.exp(-e.deltaY*0.0012)));},{passive:false});

const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
function hit(e){const r=canvas.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);
  ray.setFromCamera(ndc,camera);const h=ray.intersectObjects(buildings).find(x=>x.object.visible);return h?h.object:null;}
let hovered=null;
function hover(e){const o=hit(e);hovered=o?o.userData.ci:null;canvas.style.cursor=o?"pointer":"";}
function pick(e){const o=hit(e);if(o){stopTour();select(o.userData.ci);}else if(sel!==null){closeCard();}}

/* story tour：一架無人機的誕生 */
const STORY={
 chip:["THE BRAIN","飛控電腦即時讀取感測器、計算姿態；影像晶片處理鏡頭畫面。臺灣的半導體實力，是一架無人機的「大腦」。"],
 comm:["THE NERVES","影像傳輸、射頻元件、雷達與 GPS 天線，讓無人機和地面保持連線，也知道自己在哪裡。"],
 power:["THE HEART","電芯、電池模組與電池管理系統（BMS）決定能飛多久、多遠，是無人機的「心臟」。"],
 motor:["THE MUSCLE","無刷馬達與電子調速器把電力轉成推力，讓機體穩穩升空。"],
 optic:["THE EYES","光學鏡頭與 EO/IR 攝影機是無人機的「眼睛」，負責測繪、巡檢與偵察。"],
 struct:["THE BONES","碳纖維複材機體與精密加工，讓機身輕巧又堅固。"],
 system:["ASSEMBLY","上游零組件在這裡匯流：整機廠設計、組裝與系統整合，一架無人機正式成形。"],
 service:["TAKE-OFF","起飛之後：農業噴灑、電力巡線、航拍測繪、群飛表演與人才培訓。"],
 test:["BACKUP","研究法人與大學負責研發、檢測與驗證，替產業打底。"],
 gov:["THE PUSH","主管機關、園區與產業聯盟訂規則、給場域，也帶著廠商走向海外。"]};
const STEP_MS=7000;let story=null;
const pad=n=>String(n).padStart(2,"0");
function storySteps(){
  const ord=Object.keys(STORY),rank=id=>{const i=ord.indexOf(id);return i<0?99:i;};
  const pv=grp("產值").filter(x=>x.v);
  return [{k:"PROLOGUE",h:"一架無人機的誕生",p:`從一顆晶片到飛上天空，一架無人機要經過 ${SEGS.length} 個供應鏈環節。跟著光點，看零組件怎麼在臺灣島上匯流。`},
    ...[...SEGS].sort((a,b)=>rank(a.id)-rank(b.id)).map(s=>{const t=STORY[s.id];
      const reps=[...s.cos].sort((x,y)=>(y.star?2:0)+(y.aff.includes("td")?1:0)-(x.star?2:0)-(x.aff.includes("td")?1:0)).slice(0,4).map(c=>c.n);
      return {seg:s.id,k:t?t[0]:(s.en||"").toUpperCase(),h:s.name,p:t?t[1]:s.desc,co:reps};}),
    {k:"EPILOGUE",h:"全島連線",p:`${CO.length} 家廠商與機構，連成一座無人機供應鏈島。`+(pv.length?`產值：${pv.map(x=>`${x.y} 年 ${x.v}${x.d?`（${x.d}）`:""}`).join("、")}。`:"")}];}
function syncTourBtn(){const p=!!(story&&story.playing);press("tourBtn",p);$("tourBtn").textContent=p?"❚❚ 暫停":"▶ 導覽";
  const b=$("story").querySelector('[data-s="play"]');if(b)b.textContent=p?"❚❚ 暫停":"▶ 播放";}
function storyGo(i){story.i=i;story.t=0;const st=story.steps[i];
  if(st.seg)filterSeg(st.seg);else reset();
  $("story").innerHTML=`<div class="k"><span>${esc(st.k)}</span><span>${pad(i+1)} / ${pad(story.steps.length)}</span></div>
   <h2>${esc(st.h)}</h2><p>${esc(st.p)}</p>${st.co&&st.co.length?`<p class="who">代表單位：${st.co.map(esc).join("、")}</p>`:""}
   <div class="bar"><i id="sbar"></i></div>
   <div class="ctl"><button class="btn" data-s="prev" aria-label="上一步"${i?"":" disabled"}>‹</button><button class="btn" data-s="play"></button><button class="btn" data-s="next" aria-label="下一步"${i<story.steps.length-1?"":" disabled"}>›</button><button class="btn" data-s="replay">↺ 重播</button><button class="btn" data-s="exit">✕ 離開</button></div>`;
  syncTourBtn();}
function storyPlay(on){if(!story)return;if(on&&story.i===story.steps.length-1&&story.t>=STEP_MS){storyGo(0);}story.playing=on;syncTourBtn();}
function storyStart(){setView("island");story={steps:storySteps(),i:0,t:0,playing:true};$("story").hidden=false;stage.classList.add("storying");
  if(mode!=="seg")setMode("seg");storyGo(0);}
function storyExit(){story=null;$("story").hidden=true;stage.classList.remove("storying");syncTourBtn();reset();}
function stopTour(){if(story&&story.playing)storyPlay(false);}
$("story").addEventListener("click",e=>{const b=e.target.closest("[data-s]");if(!b||!story)return;const a=b.dataset.s;
  if(a==="exit")storyExit();else if(a==="replay"){storyGo(0);storyPlay(true);}else if(a==="play")storyPlay(!story.playing);
  else{const j=story.i+(a==="next"?1:-1);if(j>=0&&j<story.steps.length)storyGo(j);}});
$("tourBtn").onclick=()=>{if(!story)storyStart();else storyPlay(!story.playing);};

const yrs=CO.map(c=>c.y).filter(Boolean),Y1=Math.max(new Date().getFullYear(),...yrs),Y0=yrs.length?Math.min(...yrs):Y1;

document.querySelectorAll("[data-view]").forEach(b=>b.addEventListener("click",()=>setView(b.dataset.view)));

/* onboarding */
const GUIDE=[["HELLO, TAIWAN UAV","歡迎來到無人機供應鏈臺灣島",`島上每一棟建築是一家廠商或機構，共 ${CO.length} 家，顏色代表它所屬的供應鏈環節。`],
 ["01 · 操作","拖曳、縮放、點選","拖曳可以旋轉視角，滾輪或雙指可以縮放。點建築看單位介紹，點縣市名稱看當地有哪些單位。"],
 ["02 · 擺放","依所在地／依環節","「依所在地」把建築放在總部位置；「依環節」把同一環節集中，由北到南排成上游到下游。切換時建築會飛到新位置。"],
 ["03 · 工具","名牌、流向、篩選","「名牌」顯示所有單位名稱，「流向」開關供應鏈上的光點。右側「環節」可以複選，只看你關心的環節。"],
 ["04 · 檢視","島嶼、清單、時間","「清單」可以搜尋、排序所有單位；「時間」播放年份，看產業一年一年長出來。"],
 ["READY","準備起飛","建議先看一遍導覽「一架無人機的誕生」，大約一分半鐘。"]];
let gI=0;const seen=()=>{try{return localStorage.getItem("uavGuide")==="1";}catch(e){return true;}};
function guideShow(i){gI=i;const [k,h,p]=GUIDE[i],last=i===GUIDE.length-1;
  $("gBox").innerHTML=`<div class="k">${esc(k)}</div><h2 id="gH">${esc(h)}</h2><p>${esc(p)}</p>
   <div class="dots" aria-hidden="true">${GUIDE.map((_,j)=>`<i class="${j===i?"on":""}"></i>`).join("")}</div>
   <div class="ctl">${last?`<button class="btn" data-g="close">自己逛逛</button><span><button class="btn" data-g="prev">上一步</button><button class="btn pri" data-g="tour">▶ 開始導覽</button></span>`
     :`<button class="btn" data-g="close">略過</button><span>${i?`<button class="btn" data-g="prev">上一步</button>`:""}<button class="btn pri" data-g="next">下一步</button></span>`}</div>`;
  $("guide").hidden=false;$("gBox").querySelector(".pri").focus();}
function guideClose(){$("guide").hidden=true;try{localStorage.setItem("uavGuide","1");}catch(e){}}
$("gBox").addEventListener("click",e=>{const b=e.target.closest("[data-g]");if(!b)return;const a=b.dataset.g;
  if(a==="next")guideShow(gI+1);else if(a==="prev")guideShow(gI-1);else{guideClose();if(a==="tour")storyStart();else $("helpBtn").focus();}});
$("guide").addEventListener("click",e=>{if(e.target===$("guide"))guideClose();});
document.addEventListener("keydown",e=>{if($("guide").hidden)return;
  if(e.key==="Escape")guideClose();else if(e.key==="ArrowRight"&&gI<GUIDE.length-1)guideShow(gI+1);else if(e.key==="ArrowLeft"&&gI>0)guideShow(gI-1);});
$("helpBtn").onclick=()=>{stopTour();guideShow(0);};
stage.dataset.view="island";

/* ---------- intro & loop ---------- */
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let introT=reduce?99:0;const INTRO=2.2;
if(!reduce){buildings.forEach((b,i)=>{const y=b.position.y;b.position.y=y+25;b.material.opacity=0;
  gsap.to(b.position,{y,duration:0.7,delay:1.5+i*0.018,ease:"bounce.out"});gsap.to(b.material,{opacity:1,duration:0.3,delay:1.5+i*0.018});});}
setTimeout(()=>{$("loading").style.opacity=0;},reduce?0:900);
if(!seen())setTimeout(()=>guideShow(0),reduce?0:2600);
const clock=new THREE.Clock();const v=new THREE.Vector3();
function frame(){
  const dt=Math.min(clock.getDelta(),0.05),time=clock.elapsedTime;
  if(introT<INTRO+1){introT+=dt;tiles.forEach((t,i)=>{const delay=(25.35-t.lat)/3.5*1.3;let k=Math.min(1,Math.max(0,(introT-delay)/0.5));k=1-Math.pow(1-k,3);setTile(i,k);});tileMesh.instanceMatrix.needsUpdate=true;}
  updateCam();
  if(story&&story.playing){story.t+=dt*1000;const bar=$("sbar");if(bar)bar.style.width=Math.min(100,story.t/STEP_MS*100)+"%";
    if(story.t>=STEP_MS){if(story.i<story.steps.length-1)storyGo(story.i+1);else storyPlay(false);}}
  if(viewMode==="list"){requestAnimationFrame(frame);return;}
  const a=activeSet();
  const geo=mode==="geo";
  flows.forEach(f=>{const on=a.size&&(a.has(f.a)||a.has(f.b));const op=!flowOn?0:a.size?(on?0.85:0.06):(geo?0.25:0.4);
    f.line.material.opacity+= (op-f.line.material.opacity)*0.15;f.line.visible=f.line.material.opacity>0.01;
    const dop=!flowOn?0:a.size?(on?1:0.04):0.75;
    f.dots.forEach(({d,o,lag,fade})=>{const tt=reduce?o:((time*0.16+o-lag)%1+1)%1;d.position.copy(f.curve.getPoint(tt));d.material.opacity=dop*fade;d.visible=flowOn&&!(reduce&&lag);});});
  if(introT>3.2)buildings.forEach(b=>{const ci=b.userData.ci,c=CO[ci];const t=isOn(ci,a)?1:0.2;b.material.opacity+=(t-b.material.opacity)*0.15;
    b.material.emissive.setHex(ci===sel||ci===hovered?0x333333:0x000000);
    const g=yearF===null||(c.y&&c.y<=yearF)?1:0;b.userData.g+=reduce?g-b.userData.g:(g-b.userData.g)*0.14;
    b.scale.y=b.userData.ht*Math.max(0.001,b.userData.g);b.visible=b.userData.g>0.02;});
  const pulse=reduce?0.5:(time*0.6)%1;ring.scale.setScalar(1+pulse*1.6);ring.material.opacity=(1-pulse)*0.9;if(starCo){ring.visible=starCo.mesh.visible;ring.position.set(starCo.mesh.position.x,starCo.mesh.position.y+0.15,starCo.mesh.position.z);}
  const w=stage.clientWidth,h=stage.clientHeight;
  SEGS.forEach(s=>{v.copy(s.center);v.y+=2.2;v.project(camera);s.label.style.left=((v.x+1)/2*w)+"px";s.label.style.top=((1-v.y)/2*h)+"px";
    s.label.style.opacity=introT<2||geo?0:(a.size&&!a.has(s.id)?0.45:1);s.label.style.pointerEvents=geo?"none":"";});
  cityLab.forEach(L=>{v.set(L.x,L.unk?2.5:1.6,L.z);v.project(camera);L.label.style.left=((v.x+1)/2*w)+"px";L.label.style.top=((1-v.y)/2*h)+"px";
    L.label.style.opacity=introT<2||!geo?0:(cityF&&cityF!==L?0.4:(L.empty?0.55:1));L.label.style.pointerEvents=geo?"":"none";});
  CO.forEach((c,i)=>{const special=i===sel||i===hovered||(segs.has(c.s)&&segs.size<=2)||(cityF&&cityF.cos.includes(i))||c.star||(yearF!==null&&c.y===yearF);
    const show=c.mesh.visible&&introT>2.4&&(special||(labAll&&isOn(i,a)));
    c.label.style.opacity=show?1:0;c.label.classList.toggle("all",show&&!special);if(!show)return;
    v.copy(c.mesh.position);v.y+=c.mesh.scale.y+0.4;v.project(camera);c.label.style.left=((v.x+1)/2*w)+"px";c.label.style.top=((1-v.y)/2*h)+"px";});
  renderer.render(scene,camera);requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
